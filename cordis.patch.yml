# Install with: dsh plugin --profile <profile> add <path-or-git-url>
# Production deployments must override homeserverUrl, userId, accessToken,
# deviceId, agoraServerUrl, and agoraApiToken in the profile's cordis.patch.yml.
- insert:
    - id: matrix-connector
      name: 'dsh-matrix-connector'
      config:
        requestTimeoutMs: 10000
        commandName: 'agora'
        # Optional Core organization id/slug for concise `/agora company`
        # and `/agora assistant ...` commands.
        # companyOrganization: 'my-company'
        nodeEnabled: true
        shareSessionInChannel: false
        allowFrom: '*'
        autoJoin: true
        eventPollIntervalMs: 5000
        # ─── v0.6 R-E Space nesting (opt-in) ──────────────────────────────
        # Space aggregation is OFF by default (preserves v0.5 behaviour).
        # To enable, uncomment the `spaces` block below AND replace the
        # `rootSpaces` list with the homeserver room_ids of the matrix
        # Spaces you want this connector instance to aggregate child
        # timeline messages from. The smoke test created the
        # `!OCNKEikkiiJEMdWyiQ:agent-hub.local` Space for verification.
        #
        # spaces:
        #   enabled: true
        #   rootSpaces:
        #     - '!OCNKEikkiiJEMdWyiQ:agent-hub.local'
        #
        # v0.2 protected personal instance. Use a separate plugin row and
        # dedicated bot identity for every protected domain; never nest these
        # roots under the Company Space.
        # securityBoundary:
        #   domainRef: 'domain:companion'
        #   boundaryKind: 'companion'
        #   rootSpaceId: '!COMPANION_ROOT:agent-hub.local'
        #   requireTopLevelRoot: true
        #   allowedRoomIds:
        #     - '!COMPANION_PRIVATE:agent-hub.local'
        # speech:
        #   enabled: true
        #   provider: 'windows-sapi'
        #   voiceName: 'Microsoft Huihui Desktop'
        #   rate: 0
        # initiativeDelivery:
        #   enabled: true
        #   consumerRef: 'connector:companion-node-b'
        #   pollIntervalMs: 5000
        #   bindings:
        #     'binding:companion-primary': '!COMPANION_PRIVATE:agent-hub.local'
